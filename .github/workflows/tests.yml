name: tests
on: [push, pull_request]

env:
  DJANGO_SECRET_KEY: ci-only-not-secret
  POSTGRES_DB: mimcor
  POSTGRES_USER: mimcor
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_HOST: localhost
  DEMO_USER_PASSWORD: ci-demo-password

jobs:
  test:
    name: Django testleri
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mimcor
          POSTGRES_USER: mimcor
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimcor" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py migrate && python manage.py seed_demo

  docker:
    # Yerel Docker ortamı: imaj derlenir, iki profilin yapılandırması doğrulanır, örnek ortam kurulup HTTP ile denenir.
    name: Docker yapılandırması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose yapılandırması (local-http ve secure)
        run: |
          docker compose --env-file env/example.env -f compose.yml config -q
          docker compose --env-file env/example.env -f compose.yml -f compose.secure.yml config -q
      - name: Temiz kurulum, giriş sayfası ve statik dosya (DEBUG=0)
        run: |
          ./scripts/mimcor.sh init demo
          curl -fsS -o /dev/null http://localhost:8080/giris/
          curl -fsS -o /dev/null http://localhost:8080/static/css/app.css
          ./scripts/mimcor.sh down demo
          ./scripts/mimcor.sh up demo
          curl -fsS -o /dev/null http://localhost:8080/giris/
      - name: Ortamı kaldır
        if: always()
        run: docker compose -p mimcor-demo --env-file env/demo.env -f compose.yml down -v || true

  browser:
    # Gerçek Chromium + PostgreSQL ile tarayıcı senaryoları (1440 px ve 390 px emülasyon; gerçek telefon testi değildir).
    name: Tarayıcı testleri (Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mimcor
          POSTGRES_USER: mimcor
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimcor" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/browser-artifacts/failures
      DEMO_SCREENSHOT_DIR: ${{ github.workspace }}/browser-artifacts/demo
      SCENARIO_SCREENSHOT_DIR: ${{ github.workspace }}/browser-artifacts/saha-senaryolari
      TNR_SCREENSHOT_DIR: ${{ github.workspace }}/browser-artifacts/teknik-numune-repete
      USABILITY_SCREENSHOT_DIR: ${{ github.workspace }}/browser-artifacts/kullanim-kolayligi
      FOREMAN_SCREENSHOT_DIR: ${{ github.workspace }}/browser-artifacts/ustabasi-numune
      DSD_SCREENSHOT_DIR: ${{ github.workspace }}/browser-artifacts/demo-son-duzeltmeler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-browser.txt
      - name: Chromium ve sistem bağımlılıkları
        run: python -m playwright install --with-deps chromium
      - name: Tarayıcı testleri
        run: >-
          python manage.py test --noinput
          ui_checks.browser_checks ui_checks.order_product_filter_checks ui_checks.field_scenarios_checks
          ui_checks.teknik_numune_checks ui_checks.demo_son_checks ui_checks.usability_checks ui_checks.ustabasi_numune_checks
      - name: Ekran görüntüleri ve hata trace'leri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarayici-ciktilari
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14
