{% if page_obj %}<nav class="pagination" aria-label="Sayfalar"><span class="muted">{{ page_obj.paginator.count }} kayıt · Sayfa {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span><div class="actions">{% if page_obj.has_previous %}<a class="btn" href="{% querystring page=page_obj.previous_page_number %}">Önceki</a>{% endif %}{% if page_obj.has_next %}<a class="btn" href="{% querystring page=page_obj.next_page_number %}">Sonraki</a>{% endif %}</div></nav>{% endif %}
