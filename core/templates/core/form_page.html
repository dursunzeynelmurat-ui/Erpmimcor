{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
<form method="post" class="card form"{% if multipart %} enctype="multipart/form-data"{% endif %}{% if review_title %} data-review="{{ title }} · {{ review_title }}"{% endif %} novalidate>{% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="actions">
    {% if submit %}<button type="submit" class="btn btn-primary">{{ submit }}</button>{% endif %}
    {% if back %}<a class="btn" href="{{ back }}">Geri</a>{% endif %}
  </div>
</form>
{% if history %}{% include "partials/history.html" %}{% endif %}
{% endblock %}
